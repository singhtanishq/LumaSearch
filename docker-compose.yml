version: '3.8'

services:
  # ------------------------------------------------------------
  # PostgreSQL - Primary Database
  # ------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumasearch-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumasearch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumasearch"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumasearch-network

  # ------------------------------------------------------------
  # Redis - Queue, Cache, Sessions
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lumasearch-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lumasearch-network

  # ------------------------------------------------------------
  # Elasticsearch - Search & Vector Index
  # ------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: lumasearch-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=lumasearch
      - indices.memory.index_buffer_size=30%
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - lumasearch-network

  # ------------------------------------------------------------
  # Local Embeddings Service (Python + sentence-transformers)
  # ------------------------------------------------------------
  embeddings:
    build:
      context: .
      dockerfile: infra/docker/embeddings/Dockerfile
    container_name: lumasearch-embeddings
    environment:
      - MODEL_NAME=sentence-transformers/all-mpnet-base-v2
      - BATCH_SIZE=32
      - MAX_LENGTH=512
      - DEVICE=cpu
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    volumes:
      - embeddings_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lumasearch-network

  # ------------------------------------------------------------
  # API Server (Fastify)
  # ------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: development
    container_name: lumasearch-api
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lumasearch
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LOCAL_EMBEDDING_URL=http://embeddings:8000
      - LOG_LEVEL=debug
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    networks:
      - lumasearch-network
    command: pnpm dev

  # ------------------------------------------------------------
  # Worker (Background Jobs)
  # ------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile
      target: development
    container_name: lumasearch-worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lumasearch
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LOCAL_EMBEDDING_URL=http://embeddings:8000
      - LOG_LEVEL=debug
      - WORKER_CONCURRENCY=4
    volumes:
      - ./apps/worker:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    networks:
      - lumasearch-network
    command: pnpm dev

  # ------------------------------------------------------------
  # Frontend (Next.js)
  # ------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: development
    container_name: lumasearch-web
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - lumasearch-network
    command: pnpm dev

  # ------------------------------------------------------------
  # Admin Dashboard (Next.js)
  # ------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: infra/docker/admin/Dockerfile
      target: development
    container_name: lumasearch-admin
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    ports:
      - "3002:3002"
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - lumasearch-network
    command: pnpm dev

  # ------------------------------------------------------------
  # Maildev - Local Email Testing
  # ------------------------------------------------------------
  maildev:
    image: maildev/maildev:2.1
    container_name: lumasearch-maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - lumasearch-network

  # ------------------------------------------------------------
  # Jaeger - Distributed Tracing
  # ------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: lumasearch-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
      - "6831:6831/udp"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
    volumes:
      - jaeger_data:/var/lib/jaeger
    networks:
      - lumasearch-network

  # ------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47
    container_name: lumasearch-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - lumasearch-network

  # ------------------------------------------------------------
  # Grafana - Dashboards
  # ------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.1
    container_name: lumasearch-grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - lumasearch-network

networks:
  lumasearch-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  embeddings_cache:
  jaeger_data:
  prometheus_data:
  grafana_data: