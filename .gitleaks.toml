# Gitleaks configuration for LumaSearch.
# Extends the default rules; excludes files that legitimately contain
# example/dummy credentials (templates, documentation).
title = "LumaSearch gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Example credentials and documentation"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.sample$''',
  '''(^|/)\.env\.template$''',
  '''^context\.md$''',
  '''^docs/''',
  '''\.gitleaksignore$''',
]
regexes = [
  '''your-[a-z-]+-(secret|key)-change-in-production''',
  '''luma:luma@''',
  '''postgresql://(luma|user):(luma|password)@''',
  '''ci-test-secret''',
]